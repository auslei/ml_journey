[project]
name = "ml_journey"
version = "0.1.0"
description = "A learning path from linear algebra to LLM fine-tuning."
requires-python = ">=3.12,<3.13"
dependencies = [
    "gensim>=4.4.0",
    "ipykernel",
    "matplotlib",
    "nbformat",
    "nltk>=3.10.4",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "spacy>=3.8.18",
    "sympy",
    "umap-learn>=0.5.12",
]

[project.optional-dependencies]
torch = [
    "torch",
    "torchvision",
    "keras>=3",
    "keras-tuner>=1.4.8",
    "six>=1.17.0",
]
tf = ["tensorflow"]
llm = ["transformers", "peft", "datasets"]

[dependency-groups]
dev = ["nbmake", "nbstripout", "pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "--nbmake"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
